name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
      release_name:
        description: "Release title (defaults to 'Rezonans <tag>')"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as a prerelease"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create as a draft release"
        required: false
        default: false
        type: boolean
      generate_release_notes:
        description: "Auto-generate release notes from merged PRs and commits"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GODOT_RELEASE_TAG: "4.7.2-stable"
  GODOT_TEMPLATE_DIR: "4.7.2.stable"

jobs:
  build-and-release:
    name: Build Web & Windows and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_GENERATE_NOTES: ${{ inputs.generate_release_notes }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            prerelease="$INPUT_PRERELEASE"
            draft="$INPUT_DRAFT"
            generate_notes="$INPUT_GENERATE_NOTES"
          else
            tag="$REF_NAME"
            if [[ "$tag" == *-* ]]; then
              prerelease="true"
            else
              prerelease="false"
            fi
            draft="false"
            generate_notes="true"
          fi

          if [[ -z "$tag" ]]; then
            echo "::error::Release tag must not be empty."
            exit 1
          fi

          if ! git check-ref-format "refs/tags/$tag"; then
            echo "::error::Invalid git tag name: $tag"
            exit 1
          fi

          release_name="${INPUT_RELEASE_NAME:-Rezonans $tag}"
          safe_tag="${tag//\//-}"

          {
            echo "tag=$tag"
            echo "safe_tag=$safe_tag"
            echo "release_name=$release_name"
            echo "prerelease=$prerelease"
            echo "draft=$draft"
            echo "generate_notes=$generate_notes"
          } >> "$GITHUB_OUTPUT"

      - name: Configure GD-Sync keys
        env:
          GDSYNC_KEYS_CFG: ${{ secrets.GDSYNC_KEYS_CFG }}
          GDSYNC_PUBLIC_KEY: ${{ secrets.GDSYNC_PUBLIC_KEY }}
          GDSYNC_PRIVATE_KEY: ${{ secrets.GDSYNC_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          keys_path="addons/GD-Sync/keys.cfg"
          if [[ -n "$GDSYNC_KEYS_CFG" ]]; then
            printf '%s\n' "$GDSYNC_KEYS_CFG" > "$keys_path"
            if ! grep -Eq '^\s*publicKey\s*=' "$keys_path" || ! grep -Eq '^\s*privateKey\s*=' "$keys_path"; then
              echo "::error::GDSYNC_KEYS_CFG is missing publicKey or privateKey entries."
              exit 1
            fi
            echo "Configured GD-Sync keys from GDSYNC_KEYS_CFG secret."
          elif [[ -n "$GDSYNC_PUBLIC_KEY" && -n "$GDSYNC_PRIVATE_KEY" ]]; then
            python3 - "$keys_path" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]
          public_key = json.dumps(os.environ["GDSYNC_PUBLIC_KEY"])
          private_key = json.dumps(os.environ["GDSYNC_PRIVATE_KEY"])
          with open(path, "w", encoding="utf-8") as fh:
              fh.write("[keys]\n\n")
              fh.write(f"publicKey={public_key}\n")
              fh.write(f"privateKey={private_key}\n")
          PY
            echo "Configured GD-Sync keys from GDSYNC_PUBLIC_KEY and GDSYNC_PRIVATE_KEY secrets."
          else
            echo "::error::GD-Sync secrets are required for release builds. Set GDSYNC_PUBLIC_KEY and GDSYNC_PRIVATE_KEY (or GDSYNC_KEYS_CFG) in repository Actions secrets."
            exit 1
          fi

          test -s "$keys_path"

      - name: Cache Godot editor and export templates
        id: godot_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-ci/${{ env.GODOT_RELEASE_TAG }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          key: godot-${{ runner.os }}-${{ env.GODOT_RELEASE_TAG }}-v1

      - name: Install Godot ${{ env.GODOT_RELEASE_TAG }} and export templates
        run: |
          set -euo pipefail

          godot_cache_dir="$HOME/.cache/godot-ci/${GODOT_RELEASE_TAG}"
          godot_bin="$godot_cache_dir/Godot_v${GODOT_RELEASE_TAG}_linux.x86_64"
          templates_dir="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          base_url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE_TAG}"

          mkdir -p "$godot_cache_dir" "$templates_dir"

          if [[ ! -x "$godot_bin" ]]; then
            echo "Downloading Godot ${GODOT_RELEASE_TAG} Linux binary..."
            curl -fSL --retry 3 --retry-delay 5 \
              "${base_url}/Godot_v${GODOT_RELEASE_TAG}_linux.x86_64.zip" \
              -o /tmp/godot.zip
            unzip -oq /tmp/godot.zip -d "$godot_cache_dir"
            rm -f /tmp/godot.zip
            chmod +x "$godot_bin"
          fi

          if [[ ! -f "$templates_dir/version.txt" ]]; then
            echo "Downloading Godot ${GODOT_RELEASE_TAG} export templates..."
            curl -fSL --retry 3 --retry-delay 5 \
              "${base_url}/Godot_v${GODOT_RELEASE_TAG}_export_templates.tpz" \
              -o /tmp/templates.tpz
            rm -rf /tmp/godot_templates
            unzip -oq /tmp/templates.tpz -d /tmp/godot_templates
            cp -a /tmp/godot_templates/templates/. "$templates_dir/"
            rm -rf /tmp/templates.tpz /tmp/godot_templates
          fi

          "$godot_bin" --version
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"

      - name: Import project resources
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --import

      - name: Build Web export
        run: |
          set -euo pipefail
          rm -rf build/web
          chmod +x ./scripts/build_web.sh
          ./scripts/build_web.sh
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
          ls -lh build/web

      - name: Build Windows export
        run: |
          set -euo pipefail
          rm -rf build/windows
          chmod +x ./scripts/build_windows.sh
          ./scripts/build_windows.sh
          test -s build/windows/Rezonans.exe
          test -s build/windows/Rezonans.pck
          ls -lh build/windows

      - name: Clean up temporary GD-Sync keys
        if: always()
        run: rm -f addons/GD-Sync/keys.cfg

      - name: Package release archives
        env:
          SAFE_TAG: ${{ steps.release_meta.outputs.safe_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist

          web_zip="$PWD/dist/rezonans-${SAFE_TAG}-web.zip"
          windows_zip="$PWD/dist/rezonans-${SAFE_TAG}-windows.zip"

          (cd build/web && zip -9 -r "$web_zip" .)
          (cd build/windows && zip -9 -r "$windows_zip" .)

          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rezonans-${{ steps.release_meta.outputs.safe_tag }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.release_meta.outputs.release_name }}
          PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
          DRAFT: ${{ steps.release_meta.outputs.draft }}
          GENERATE_NOTES: ${{ steps.release_meta.outputs.generate_notes }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading updated assets..."
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            args=(
              "$TAG"
              dist/*.zip
              dist/SHA256SUMS.txt
              --target "$GITHUB_SHA"
              --title "$RELEASE_NAME"
            )
            if [[ "$GENERATE_NOTES" == "true" ]]; then
              args+=(--generate-notes)
            else
              args+=(--notes "")
            fi
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            if [[ "$DRAFT" == "true" ]]; then
              args+=(--draft)
            fi
            gh release create "${args[@]}"
          fi
